<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>ຄຳສັ່ງຊື້</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden { display: none; }
    .tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tab-btn {
      padding: 8px 18px;
      border: 1px solid #dfe3e8;
      background: #f4f6f8;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid #dfe3e8; font-size: 0.85rem; }
    th { background: #f4f6f8; }
    select.status-select { padding: 5px 8px; border-radius: 6px; border: 1px solid #dfe3e8; }
    .cancel-btn { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .cancelled-by-badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
    .by-customer { background: #dbeafe; color: #1e40af; }
    .by-staff { background: #fef3c7; color: #92400e; }

    /* ➕ ແຖບຄົ້ນຫາ/ຕົວກອງ */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .filter-bar input, .filter-bar select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #dfe3e8;
      font-size: 0.85rem;
    }
    .filter-bar input { flex: 1; min-width: 160px; }
    .filter-clear-btn {
      background: #6b7280;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .filter-count { font-size: 0.8rem; color: #6b7280; margin-bottom: 8px; }
  </style>
</head>
<body>
  <script src="/admin/auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານ</h1>
    <nav>
      <a href="/admin/index.html">ສິນຄ້າ</a>
      <a href="/admin/orders.html" class="active">ຄຳສັ່ງຊື້</a>
      <a href="/admin/qrcode.html">QR Code</a>
      <a href="/admin/chat.html">ແຊັດ</a>
      <a href="/admin/customers.html">ລູກຄ້າ</a>
      <a href="/admin/staff.html" data-admin-only>ພະນັກງານ</a>
    </nav>
  </header>

  <main>
    <div class="tabs">
      <button id="tab-inprogress" class="tab-btn active" onclick="switchTab('inprogress')">ກຳລັງດຳເນີນການ</button>
      <button id="tab-cancelled" class="tab-btn" onclick="switchTab('cancelled')">ຍົກເລີກແລ້ວ</button>
    </div>

    <!-- ➕ ແຖບຄົ້ນຫາ/ຕົວກອງ -->
    <div class="filter-bar">
      <input type="text" id="search-phone" placeholder="ຄົ້ນຫາດ້ວຍເບີໂທ..." oninput="applyFilters()">
      <select id="filter-status" onchange="applyFilters()">
        <option value="all">ທຸກສະຖານະ</option>
        <option value="awaiting_review">ລໍຖ້າກວດສະລິບ</option>
        <option value="confirmed">ຢືນຢັນແລ້ວ</option>
        <option value="shipped">ຈັດສົ່ງແລ້ວ</option>
        <option value="delivered">ຮອດແລ້ວ</option>
      </select>
      <input type="date" id="filter-date" onchange="applyFilters()">
      <button class="filter-clear-btn" onclick="clearFilters()">ລ້າງຕົວກອງ</button>
    </div>
    <div class="filter-count" id="filter-count"></div>

    <section id="order-list-inprogress">
      <p>ກຳລັງໂຫລດ...</p>
    </section>

    <section id="order-list-cancelled" class="hidden">
      <p>ກຳລັງໂຫລດ...</p>
    </section>
  </main>

  <script src="orders.js"></script>
</body>
</html>
