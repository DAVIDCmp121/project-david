<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <title>ຮ້ານເສື້ອຜ້າ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="qrSettingsModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button id="closeQrSettingsBtn" class="modal-close">✕</button>
      <h2>ຮູບ QR ຮັບເງິນຮ້ານ</h2>
      <div class="qr-settings-box">
        <img id="current-qr" src="" alt="ยังไม่มี QR" style="display:none;">
        <p id="qr-status">ກຳລັງກວດສອບ...</p>
        <input type="file" id="qr-file" accept="image/*">
        <button onclick="uploadQr()">ອັບໂຫລດ QR</button>
      </div>
    </div>
  </div>

  <script src="/admin/auth-guard.js"></script>
  <header>
    <h1>ຈັດການຮ້ານ</h1>
    <nav>
      <a href="/admin/index.html" class="active">ສິນຄ້າ</a>
      <a href="/admin/orders.html">ຄຳສັ່ງຊື້</a>
      <a href="/admin/qrcode.html">QR Code</a>
      <button id="openQrSettingsBtn" class="qr-settings-btn">⚙️ QR ຮັບເງິນ</button>
    </nav>
  </header>

  <main>
    <section class="add-form">
      <h2>ເພີ່ມສິນຄ້າໃໝ່</h2>
      <input type="text" id="name" placeholder="ຊື່ສິນຄ້າ">
      <input type="number" id="price" placeholder="ລາຄາ">
      <input type="text" id="size" placeholder="ໄຊສ໌">
      <input type="text" id="color" placeholder="ສີ">
      <input type="number" id="stock" placeholder="ຈຳນວນສະຕ໋ອກ">
      <input type="file" id="image" accept="image/*">
      <button onclick="addProduct()">ເພີ່ມສິນຄ້າ</button>
    </section>

    <section id="product-list">
      <p>ກຳລັງໂຫລດ...</p>
    </section>
  </main>

  <script src="script.js"></script>

  <script>
  document.getElementById('openQrSettingsBtn').onclick = () => {
    document.getElementById('qrSettingsModal').style.display = 'flex';
  };
  document.getElementById('closeQrSettingsBtn').onclick = () => {
    document.getElementById('qrSettingsModal').style.display = 'none';
  };
  document.getElementById('qrSettingsModal').addEventListener('click', (e) => {
    if (e.target.id === 'qrSettingsModal') {
      document.getElementById('qrSettingsModal').style.display = 'none';
    }
  });
  </script>
</body>
</html>
