<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<title>ແຊັດລູກຄ້າ</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --navy: #1e3a5f;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --gray-bg: #f4f6f8;
    --gray-border: #dfe3e8;
    --text-dark: #1f2937;
    --text-mid: #6b7280;
  }
  .chat-layout {
    display: flex;
    height: calc(100vh - 120px);
    border: 1px solid var(--gray-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  #customerList {
    width: 280px;
    border-right: 1px solid var(--gray-border);
    overflow-y: auto;
    background: #fafbfc;
  }
  .customer-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--gray-border);
    cursor: pointer;
    position: relative;
  }
  .customer-item:hover { background: #eef1f4; }
  .customer-item.active { background: var(--blue-light); border-left: 3px solid var(--blue); }
  .customer-item .cname { font-weight: 600; color: var(--text-dark); }
  .customer-item .clast {
    font-size: 0.8rem;
    color: var(--text-mid);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .unread-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: #dc2626;
    color: #fff;
    border-radius: 50%;
    min-width: 18px;
    height: 18px;
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  #chatPane { flex: 1; display: flex; flex-direction: column; background: #fff; }
  #chatHeader {
    padding: 14px;
    border-bottom: 1px solid var(--gray-border);
    font-weight: 600;
    color: var(--text-dark);
    background: #fafbfc;
  }
  #adminChatBox {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--gray-bg);
  }
  .abubble { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; }
  .abubble.customer { align-self: flex-start; background: #fff; color: var(--text-dark); border: 1px solid var(--gray-border); }
  .abubble.admin { align-self: flex-end; background: var(--blue); color: #fff; }
  .abubble.image-only { background: none; border: none; padding: 0; }
  .abubble img {
    max-width: 220px;
    max-height: 300px;
    width: 100%;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 4px;
    cursor: pointer;
    display: block;
  }
  .abubble-time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; text-align: right; }
  #adminInputBar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--gray-border);
    background: #fff;
  }
  #adminTextInput {
    flex: 1;
    padding: 10px 12px;
    border-radius: 20px;
    border: 1px solid var(--gray-border);
    background: var(--gray-bg);
    color: var(--text-dark);
    font-size: 0.9rem;
  }
  #adminTextInput:focus { outline: none; border-color: var(--blue); background: #fff; }
  #adminInputBar button, #adminInputBar label {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
  }
  #adminInputBar button:hover, #adminInputBar label:hover { background: var(--navy); }
  #adminImageInput { display: none; }
  #emptyState { padding: 20px; color: var(--text-mid); text-align: center; }
</style>
</head>
<body>

<script src="/admin/auth-guard.js"></script>
<header>
  <h1>ແຊັດລູກຄ້າ</h1>
  <nav>
    <a href="/admin/index.html">ສິນຄ້າ</a>
    <a href="/admin/orders.html">ຄຳສັ່ງຊື້</a>
    <a href="/admin/qrcode.html">QR Code</a>
    <a href="/admin/chat.html" class="active">ແຊັດ</a>
    <a href="/admin/customers.html">ລູກຄ້າ</a>
<a href="/admin/staff.html" data-admin-only>ພະນັກງານ</a>
  </nav>
</header>

<main>
  <div class="chat-layout">
    <div id="customerList"></div>
    <div id="chatPane">
      <div id="chatHeader">ເລືອກລູກຄ້າເພື່ອເລີ່ມແຊັດ</div>
      <div id="adminChatBox"><div id="emptyState">ຍັງບໍ່ໄດ້ເລືອກລູກຄ້າ</div></div>
      <div id="adminInputBar" style="display:none;">
        <label for="adminImageInput">📷</label>
        <input type="file" id="adminImageInput" accept="image/*">
        <input type="text" id="adminTextInput" placeholder="ພິມຂໍ້ຄວາມ...">
        <button onclick="sendAdminText()">ສົ່ງ</button>
      </div>
    </div>
  </div>
</main>

<audio id="notifySound" src="/admin/notify.wav" preload="auto"></audio>

<script>
let currentCustomerId = null;
let lastListJson = '';
let lastMsgCount = 0;

async function loadCustomerList() {
  try {
    const res = await fetch('/api/messages/list', { credentials: 'include' });
    const data = await res.json();
    renderCustomerList(data.customers || []);
  } catch (err) {
    console.error(err);
  }
}

function renderCustomerList(customers) {
  const json = JSON.stringify(customers);
  const hasNewUnread = customers.some(c => c.unread_count > 0) && json !== lastListJson && lastListJson !== '';
  if (json === lastListJson) return;
  lastListJson = json;

  if (hasNewUnread) {
    document.getElementById('notifySound').play().catch(() => {});
  }

  const list = document.getElementById('customerList');
  list.innerHTML = '';

  if (customers.length === 0) {
    list.innerHTML = '<div style="padding:14px;color:#6b7280;">ຍັງບໍ່ມີແຊັດ</div>';
    return;
  }

  customers.forEach(c => {
    const item = document.createElement('div');
    item.className = 'customer-item' + (c.id === currentCustomerId ? ' active' : '');
    item.onclick = () => openCustomerChat(c.id, c.name || c.phone);
    item.innerHTML = `
      <div class="cname">${c.name || c.phone}</div>
      <div class="clast">${c.last_message || '(ຮູບພາບ)'}</div>
      ${c.unread_count > 0 ? `<div class="unread-badge">${c.unread_count}</div>` : ''}
    `;
    list.appendChild(item);
  });
}

async function openCustomerChat(customerId, label) {
  currentCustomerId = customerId;
  lastMsgCount = 0;
  document.getElementById('chatHeader').textContent = label;
  document.getElementById('adminInputBar').style.display = 'flex';
  await loadAdminMessages();
  loadCustomerList();
}

async function loadAdminMessages() {
  if (!currentCustomerId) return;
  try {
    const res = await fetch(`/api/messages/customer/${currentCustomerId}`, { credentials: 'include' });
    const data = await res.json();
    renderAdminMessages(data.messages || []);
  } catch (err) {
    console.error(err);
  }
}

function renderAdminMessages(messages) {
  if (messages.length === lastMsgCount) return;
  lastMsgCount = messages.length;

  const box = document.getElementById('adminChatBox');
  box.innerHTML = '';

  messages.forEach(msg => {
    const isImageOnly = msg.image_url && !msg.message_text;
    const bubble = document.createElement('div');
    bubble.className = 'abubble ' + (msg.sender === 'admin' ? 'admin' : 'customer') + (isImageOnly ? ' image-only' : '');

    let html = '';
    if (msg.message_text) html += `<div>${escapeHtml(msg.message_text)}</div>`;
    if (msg.image_url) html += `<img src="${msg.image_url}" onclick="window.open('${msg.image_url}','_blank')">`;
    const time = new Date(msg.created_at).toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="abubble-time">${time}</div>`;
    bubble.innerHTML = html;
    box.appendChild(bubble);
  });

  box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function sendAdminText() {
  if (!currentCustomerId) return;
  const input = document.getElementById('adminTextInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  try {
    const res = await fetch(`/api/messages/customer/${currentCustomerId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ message_text: text })
    });
    const data = await res.json();
    if (data.success) {
      lastMsgCount = 0;
      loadAdminMessages();
    } else {
      alert(data.error || 'ສົ່ງບສຳເລັດ');
    }
  } catch (err) {
    alert('ເກີດຂໍ້ຜິດພາດ');
  }
}

document.getElementById('adminImageInput').addEventListener('change', async (e) => {
  if (!currentCustomerId) return;
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch(`/api/messages/customer/${currentCustomerId}/upload`, {
      method: 'POST',
      credentials: 'include',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      lastMsgCount = 0;
      loadAdminMessages();
    } else {
      alert(data.error || 'ອັບໂຫລດບໍ່ສຳເລັດ');
    }
  } catch (err) {
    alert('ເກີດຂໍ້ຜິດພາດ');
  }
  e.target.value = '';
});

document.getElementById('adminTextInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendAdminText();
});

loadCustomerList();
setInterval(() => {
  loadCustomerList();
  if (currentCustomerId) loadAdminMessages();
}, 5000);
</script>

</body>
</html>
