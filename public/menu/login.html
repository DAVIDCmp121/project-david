<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ເຂົ້າສູ່ລະບົບ - POLO SHOP</title>
<style>
  :root {
    --gold: #C9A227;
    --black: #1a1a1a;
    --ivory: #FFFFF0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--black);
    color: var(--ivory);
    font-family: 'Noto Sans Lao', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-modal {
    background: #242424;
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 28px;
    width: 340px;
    max-width: 100%;
  }
  .auth-modal h1 {
    text-align: center;
    color: var(--gold);
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .auth-modal p.sub {
    text-align: center;
    color: #999;
    font-size: 0.8rem;
    margin: 0 0 20px;
  }
  .auth-tabs {
    display: flex;
    margin-bottom: 18px;
    border-bottom: 1px solid #333;
  }
  .auth-tab {
    flex: 1;
    background: none;
    border: none;
    color: #999;
    padding: 10px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .auth-tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); font-weight: bold; }
  .auth-form input {
    width: 100%;
    padding: 11px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #333;
    color: var(--ivory);
    font-size: 0.9rem;
  }
  .auth-submit {
    width: 100%;
    padding: 11px;
    background: var(--gold);
    color: var(--black);
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .auth-error { color: #ff6b6b; text-align: center; margin-top: 10px; min-height: 18px; font-size: 0.85rem; }
  .auth-success { color: #6bcf7f; text-align: center; margin-top: 10px; min-height: 18px; font-size: 0.85rem; }

  .forgot-link {
    text-align: center;
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--gold);
    text-decoration: underline;
    cursor: pointer;
  }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: #242424;
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 24px;
    width: 300px;
    max-width: 90%;
    position: relative;
    text-align: center;
  }
  .modal-box h2 { color: var(--gold); margin: 0 0 12px; font-size: 1.1rem; }
  .modal-box p { font-size: 0.85rem; line-height: 1.5; margin: 8px 0; color: #ccc; }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--ivory);
    font-size: 1.1rem;
    cursor: pointer;
  }
  .modal-box input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #333;
    color: var(--ivory);
    font-size: 0.85rem;
    box-sizing: border-box;
  }
</style>
</head>
<body>

  <div class="auth-modal">
    <h1>POLO SHOP</h1>
    <p class="sub">ກະລຸນາເຂົ້າສູ່ລະບົບເພື່ອເຂົ້າໜ້າຮ້ານ</p>

    <div class="auth-tabs">
      <button id="tabLogin" class="auth-tab active" onclick="switchTab('login')">ເຂົ້າສູ່ລະບົບ</button>
      <button id="tabRegister" class="auth-tab" onclick="switchTab('register')">ສະໝັກສະມາຊິກ</button>
    </div>

    <div id="loginForm" class="auth-form">
      <input type="tel" id="loginPhone" placeholder="ເບີໂທລະສັບ">
      <input type="password" id="loginPin" placeholder="ລະຫັດ PIN">
      <button class="auth-submit" onclick="submitLogin()">ເຂົ້າສູ່ລະບົບ</button>
      <p class="forgot-link" onclick="openForgotPin()">ລືມ PIN?</p>
    </div>

    <div id="registerForm" class="auth-form" style="display:none;">
      <input type="text" id="regName" placeholder="ຊື່ (ບໍ່ບັງຄັບ)">
      <input type="tel" id="regPhone" placeholder="ເບີໂທລະສັບ">
      <input type="password" id="regPin" placeholder="ຕັ້ງລະຫັດ PIN (4-6 ໂຕເລກ)">
      <!-- ➕ ຊ່ອງວັນເດືອນປີເກີດ -->
      <input type="text" id="regBirthDate" placeholder="ວັນເດືອນປີເກີດ (ໃຊ້ຢືນຢັນຕົວຕົນ)">
      <button class="auth-submit" onclick="submitRegister()">ສະໝັກສະມາຊິກ</button>
    </div>

    <div id="authError" class="auth-error"></div>
  </div>

  <!-- ➕ Modal ลืม PIN แบบใหม่ - ลูกค้ารีเซ็ตเองได้เลย -->
  <div id="forgotPinModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <button class="modal-close" onclick="closeForgotPin()">✕</button>
      <h2>ຣີເຊັດລະຫັດ PIN</h2>
      <p>ກະລຸນາປ້ອນເບີໂທ ແລະ ວັນເດືອນປີເກີດທີ່ໃຊ້ຕອນສະໝັກ ເພື່ອຕັ້ງ PIN ໃໝ່</p>
      <input type="tel" id="fpPhone" placeholder="ເບີໂທລະສັບ">
      <input type="text" id="fpBirthDate" placeholder="ວັນເດືອນປີເກີດ">
      <input type="password" id="fpNewPin" placeholder="ຕັ້ງ PIN ໃໝ່ (4-6 ໂຕເລກ)">
      <input type="password" id="fpNewPinConfirm" placeholder="ຢືນຢັນ PIN ໃໝ່">
      <button class="auth-submit" onclick="submitForgotPin()">ຕັ້ງ PIN ໃໝ່</button>
      <div id="fpError" class="auth-error"></div>
      <div id="fpSuccess" class="auth-success"></div>
    </div>
  </div>

<script>
(async function checkAlreadyLoggedIn() {
  try {
    const res = await fetch('/api/customer-auth/me', { credentials: 'include' });
    if (res.ok) {
      window.location.href = 'index.html';
    }
  } catch (err) {}
})();

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabRegister').classList.toggle('active', !isLogin);
  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  document.getElementById('authError').textContent = '';
}

function openForgotPin() {
  document.getElementById('forgotPinModal').style.display = 'flex';
  document.getElementById('fpError').textContent = '';
  document.getElementById('fpSuccess').textContent = '';
}
function closeForgotPin() {
  document.getElementById('forgotPinModal').style.display = 'none';
}
document.getElementById('forgotPinModal').addEventListener('click', (e) => {
  if (e.target.id === 'forgotPinModal') closeForgotPin();
});

async function submitLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const errBox = document.getElementById('authError');
  errBox.textContent = '';

  if (!phone || !pin) {
    errBox.textContent = 'ກະລຸນາປ້ອນເບີໂທ ແລະ PIN';
    return;
  }

  try {
    const res = await fetch('/api/customer-auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ phone, pin })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = 'index.html';
    } else {
      errBox.textContent = data.error || 'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ';
    }
  } catch (err) {
    errBox.textContent = 'ເກີດຂໍ້ຜິດພາດ, ລອງໃໝ່ພາຍຫຼັງ';
  }
}

async function submitRegister() {
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pin = document.getElementById('regPin').value.trim();
  const birth_date = document.getElementById('regBirthDate').value.trim();
  const errBox = document.getElementById('authError');
  errBox.textContent = '';

  if (!phone || !pin || !birth_date) {
    errBox.textContent = 'ກະລຸນາປ້ອນເບີໂທ, PIN ແລະ ວັນເດືອນປີເກີດ';
    return;
  }

  try {
    const res = await fetch('/api/customer-auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ phone, pin, name, birth_date })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = 'index.html';
    } else {
      errBox.textContent = data.error || 'ສະໝັກສະມາຊິກບໍ່ສຳເລັດ';
    }
  } catch (err) {
    errBox.textContent = 'ເກີດຂໍ້ຜິດພາດ, ລອງໃໝ່ພາຍຫຼັງ';
  }
}

// ➕ ຟັງກ໌ຊັນລືມ PIN ແບບໃໝ່ — ຢືນຢັນເອງດ້ວຍເບີໂທ+ວັນເກີດ ບໍ່ຕ້ອງພົວພັນຮ້ານ
async function submitForgotPin() {
  const phone = document.getElementById('fpPhone').value.trim();
  const birth_date = document.getElementById('fpBirthDate').value.trim();
  const new_pin = document.getElementById('fpNewPin').value.trim();
  const new_pin_confirm = document.getElementById('fpNewPinConfirm').value.trim();
  const errBox = document.getElementById('fpError');
  const successBox = document.getElementById('fpSuccess');
  errBox.textContent = '';
  successBox.textContent = '';

  if (!phone || !birth_date || !new_pin || !new_pin_confirm) {
    errBox.textContent = 'ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບ';
    return;
  }
  if (new_pin !== new_pin_confirm) {
    errBox.textContent = 'PIN ໃໝ່ ແລະ ຢືນຢັນ PIN ບໍ່ຕົງກັນ';
    return;
  }

  try {
    const res = await fetch('/api/customer-auth/forgot-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, birth_date, new_pin })
    });
    const data = await res.json();
    if (data.success) {
      successBox.textContent = data.message || 'ຕັ້ງ PIN ໃໝ່ສຳເລັດ';
      setTimeout(() => {
        closeForgotPin();
        document.getElementById('loginPhone').value = phone;
      }, 1500);
    } else {
      errBox.textContent = data.error || 'ຣີເຊັດ PIN ບໍ່ສຳເລັດ';
    }
  } catch (err) {
    errBox.textContent = 'ເກີດຂໍ້ຜິດພາດ, ລອງໃໝ່ພາຍຫຼັງ';
  }
}
</script>

</body>
</html>
