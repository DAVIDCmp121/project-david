<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ແຊັດກັບຮ້ານ - POLO SHOP</title>
<style>
  :root {
    --navy: #1e3a5f;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --gray-bg: #f4f6f8;
    --gray-border: #dfe3e8;
    --text-dark: #1f2937;
    --text-mid: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    background: #fff;
    color: var(--text-dark);
    font-family: 'Noto Sans Lao', sans-serif;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 480px;
    border-left: 1px solid var(--gray-border);
    border-right: 1px solid var(--gray-border);
  }
  header {
    background: #fafbfc;
    border-bottom: 1px solid var(--gray-border);
    padding: 14px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.1rem; color: var(--navy); }
  #chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--gray-bg);
  }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.92rem;
    line-height: 1.4;
    word-break: break-word;
  }
  .bubble.customer {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .bubble.admin {
    align-self: flex-start;
    background: #fff;
    color: var(--text-dark);
    border: 1px solid var(--gray-border);
    border-bottom-left-radius: 2px;
  }
  .bubble.image-only {
    background: none;
    border: none;
    padding: 0;
  }
  .bubble img {
    max-width: 220px;
    max-height: 300px;
    width: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin-top: 4px;
    cursor: pointer;
  }
  .bubble-time {
    font-size: 0.65rem;
    opacity: 0.7;
    margin-top: 4px;
    text-align: right;
  }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #fff;
    border-top: 1px solid var(--gray-border);
  }
  #textInput {
    flex: 1;
    padding: 10px 12px;
    border-radius: 20px;
    border: 1px solid var(--gray-border);
    background: var(--gray-bg);
    color: var(--text-dark);
    font-size: 0.9rem;
  }
  #textInput:focus { outline: none; border-color: var(--blue); background: #fff; }
  #inputBar button, #inputBar label {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
  }
  #inputBar button:hover, #inputBar label:hover { background: var(--navy); }
  #imageInput { display: none; }
  #loginBox {
    max-width: 340px;
    margin: 60px auto;
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--gray-border);
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  #loginBox input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid var(--gray-border);
    background: var(--gray-bg);
    color: var(--text-dark);
  }
  #loginBox button {
    width: 100%;
    padding: 10px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  #loginError { color: #dc2626; text-align: center; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<div id="loginBox" style="display:none;">
  <h2 style="text-align:center;color:var(--navy);font-size:1rem;">ເຂົ້າສູ່ລະບົບເພື່ອແຊັດ</h2>
  <input type="tel" id="phoneInput" placeholder="ເບີໂທລະສັບ">
  <input type="password" id="pinInput" placeholder="ລະຫັດ PIN">
  <button onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button>
  <div id="loginError"></div>
</div>
<audio id="notifySound" src="notify.wav" preload="auto"></audio>>
<div id="chatUI" style="display:none; height:100%; display:flex; flex-direction:column;">
  <header><h1>ແຊັດກັບຮ້ານ POLO SHOP</h1></header>
  <div id="chatBox"></div>
  <div id="inputBar">
    <label for="imageInput">📷</label>
    <input type="file" id="imageInput" accept="image/*">
    <input type="text" id="textInput" placeholder="ພິມຂໍ້ຄວາມ...">
    <button onclick="sendText()">➤</button>
  </div>
</div>

<script>
let lastMessageCount = 0;
let pollTimer = null;

async function checkLoginAndStart() {
  try {
    const res = await fetch('/api/messages', { credentials: 'include' });
    if (res.status === 401) {
      showLogin();
      return;
    }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('chatUI').style.display = 'flex';
    loadMessages();
    if (!pollTimer) pollTimer = setInterval(loadMessages, 5000);
  } catch (err) {
    showLogin();
  }
}

function showLogin() {
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('chatUI').style.display = 'none';
}

async function doLogin() {
  const phone = document.getElementById('phoneInput').value.trim();
  const pin = document.getElementById('pinInput').value.trim();
  const errBox = document.getElementById('loginError');
  errBox.textContent = '';

  if (!phone || !pin) {
    errBox.textContent = 'ກະລຸນາປ້ອນເບໂທ ແລະ PIN';
    return;
  }

  try {
    const res = await fetch('/api/customer-auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ phone, pin })
    });
    const data = await res.json();
    if (data.success) {
      checkLoginAndStart();
    } else {
      errBox.textContent = data.error || 'ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ';
    }
  } catch (err) {
    errBox.textContent = 'ເກີດຂໍ້ຜິດພາດ, ລອງໃໝ່ພາຍຫຼງ';
  }
}

async function loadMessages() {
  try {
    const res = await fetch('/api/messages', { credentials: 'include' });
    if (res.status === 401) {
      clearInterval(pollTimer);
      pollTimer = null;
      showLogin();
      return;
    }
    const data = await res.json();
    renderMessages(data.messages || []);
  } catch (err) {
    console.error(err);
  }
}

function renderMessages(messages) {
  if (messages.length === lastMessageCount) return;

  // ຖ້າມີຂໍ້ຄວາມໃໝ່ ແລະ ຂໍ້ຄວາມລ່າສຸດແມ່ນມາຈາກແອດມິນ (ບແມ່ນທີ່ລູກຄ້າຫາກໍສົ່ງເອງ) ໃຫ້ຫຼິ້ນສຽງແຈ້ງເຕືອນ
  const isFirstLoad = lastMessageCount === 0;
  const hasNewMessages = messages.length > lastMessageCount;
  const lastMsg = messages[messages.length - 1];
  if (hasNewMessages && !isFirstLoad && lastMsg && lastMsg.sender === 'admin') {
    document.getElementById('notifySound').play().catch(() => {});
  }

  lastMessageCount = messages.length;

  const box = document.getElementById('chatBox');
  box.innerHTML = '';

  messages.forEach(msg => {
    const isImageOnly = msg.image_url && !msg.message_text;
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (msg.sender === 'customer' ? 'customer' : 'admin') + (isImageOnly ? ' image-only' : '');

    let html = '';
    if (msg.message_text) {
      html += `<div>${escapeHtml(msg.message_text)}</div>`;
    }
    if (msg.image_url) {
      html += `<img src="${msg.image_url}" onclick="window.open('${msg.image_url}','_blank')">`;
    }
    const time = new Date(msg.created_at).toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="bubble-time">${time}</div>`;

    bubble.innerHTML = html;
    box.appendChild(bubble);
  });

  box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function sendText() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  try {
    const res = await fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ message_text: text })
    });
    const data = await res.json();
    if (data.success) {
      loadMessages();
    } else {
      alert(data.error || 'ສົ່ງຂຄວາມບໍ່ສຳເລັດ');
    }
  } catch (err) {
    alert('ເກີດຂໍ້ຜິດພາດ');
  }
}

document.getElementById('imageInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch('/api/messages/upload', {
      method: 'POST',
      credentials: 'include',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      loadMessages();
    } else {
      alert(data.error || 'ອັບໂຫລດຮູບບໍ່ສຳເລດ');
    }
  } catch (err) {
    alert('ເກີດຂໍ້ຜິດພາດ');
  }
  e.target.value = '';
});

document.getElementById('textInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendText();
});

checkLoginAndStart();
</script>

</body>
</html>
